<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Cursos - Zoe Academy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* =========================================
           ESTILOS DE MIS CURSOS (ESTUDIANTE)
           ========================================= */

        .page-header {
            margin-bottom: 24px;
        }
        .page-header h1 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #111827;
        }

        /* Tarjeta principal de la Matrícula */
        .matricula-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
            margin-bottom: 32px;
            overflow: hidden;
        }

        /* Encabezado de la Tarjeta */
        .matricula-header {
            background: linear-gradient(to right, #f9fafb, #ffffff);
            padding: 20px 24px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .matricula-header h2 {
            margin: 0;
            font-size: 1.25rem;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .matricula-header h2 span {
            color: #991b1b;
            font-weight: 700;
        }

        /* Cuadrícula de Información */
        .matricula-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            padding: 20px 24px;
            background-color: #ffffff;
            border-bottom: 1px dashed #e5e7eb;
        }
        .info-block {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .info-icon {
            padding: 8px;
            background: #f3f4f6;
            color: #4b5563;
            border-radius: 8px;
            display: flex;
        }
        .info-text {
            display: flex;
            flex-direction: column;
        }
        .info-label {
            font-size: 0.8rem;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .info-value {
            font-size: 0.95rem;
            color: #111827;
            font-weight: 600;
        }

        /* Badges */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
        }
        .badge.activo { background: #d1fae5; color: #065f46; }
        .badge.inactivo { background: #fee2e2; color: #991b1b; }

        /* Estilo de Tabla Moderna */
        .cursos-section {
            padding: 0;
        }
        .modern-table {
            width: 100%;
            border-collapse: collapse;
        }
        .modern-table th {
            background-color: #f9fafb;
            padding: 16px 24px;
            text-align: left;
            font-size: 0.85rem;
            color: #6b7280;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #e5e7eb;
            border-top: 1px solid #e5e7eb;
        }
        .modern-table td {
            padding: 16px 24px;
            color: #374151;
            font-size: 0.95rem;
            border-bottom: 1px solid #f3f4f6;
            vertical-align: top;
        }
        .modern-table tr:last-child td {
            border-bottom: none;
        }
        .modern-table tr:hover td {
            background-color: #fdfdfd;
        }
        .curso-nombre {
            font-weight: 700;
            color: #111827;
        }

        /* Alertas */
        .alert-info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e3a8a;
            padding: 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            margin-bottom: 24px;
        }
        .empty-courses {
            padding: 40px 24px;
            text-align: center;
            color: #6b7280;
            background-color: #f9fafb;
        }
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/nav-estudiante :: nav}"></div>
    
    <main class="content">
        <div class="page-header">
            <h1>
                <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: #991b1b;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                Mis Cursos
            </h1>
        </div>

        <div th:if="${matriculas.isEmpty()}" class="alert-info">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            No tienes matrículas activas actualmente.
        </div>

        <!-- Iteración por cada matrícula -->
        <div th:each="m : ${matriculas}" class="matricula-card">
            
            <!-- Encabezado -->
            <div class="matricula-header">
                <h2>
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: #6b7280;"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                    Ciclo: <span th:text="${m.ciclo.nombre.getNombre()}"></span>
                </h2>
            </div>
            
            <!-- Información de la Matrícula -->
            <div class="matricula-info">
                <div class="info-block">
                    <div class="info-icon">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    </div>
                    <div class="info-text">
                        <span class="info-label">Periodo</span>
                        <span class="info-value" th:text="${m.periodo.nombre}"></span>
                    </div>
                </div>

                <div class="info-block">
                    <div class="info-icon">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                    <div class="info-text">
                        <span class="info-label">Estado</span>
                        <div>
                            <span class="badge" 
                                  th:classappend="${m.estado.name() == 'ACTIVO' or m.estado == 'ACTIVO'} ? 'activo' : 'inactivo'" 
                                  th:text="${m.estado}">
                            </span>
                        </div>
                    </div>
                </div>

                <div class="info-block">
                    <div class="info-icon">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                    <div class="info-text">
                        <span class="info-label">Fecha de matrícula</span>
                        <span class="info-value" th:text="${m.fechaMatricula}"></span>
                    </div>
                </div>
            </div>

            <!-- Tabla de Cursos -->
            <div class="cursos-section">
                <div th:if="${cursos != null and !cursos.isEmpty()}">
                    <table class="modern-table">
                        <thead>
                            <tr>
                                <th style="width: 5%;">#</th>
                                <th style="width: 25%;">Curso</th>
                                <th style="width: 35%;">Descripción</th>
                                <th style="width: 20%;">Docente</th>
                                <th style="width: 15%;">Aula</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="curso, iter : ${cursos}">
                                <td th:text="${iter.count}" style="color: #9ca3af; font-weight: 500;">1</td>
                                <td>
                                    <span class="curso-nombre" th:text="${curso.nombre}"></span>
                                </td>
                                <td th:text="${curso.descripcion != null ? curso.descripcion : 'Sin descripción'}" style="color: #6b7280; font-size: 0.9rem;"></td>
                                <td>
                                    <div style="display: flex; align-items: center; gap: 6px;">
                                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="color: #9ca3af;"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                        <span th:text="${curso.docente != null ? (curso.docente.nombre + ' ' + curso.docente.apellido) : 'Por asignar'}"></span>
                                    </div>
                                </td>
                                <td>
                                    <div style="display: flex; align-items: center; gap: 6px;">
                                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="color: #9ca3af;"><path stroke-linecap="round" stroke-linejoin="round" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"/></svg>
                                        <span th:text="${curso.aula != null ? curso.aula.codigo : 'Por asignar'}"></span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Estado vacío si no hay cursos -->
                <div th:if="${cursos == null or cursos.isEmpty()}" class="empty-courses">
                    <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24" style="margin-bottom: 12px; opacity: 0.4;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                    <p style="margin: 0; font-style: italic;">No hay cursos registrados todavía para este ciclo académico.</p>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
