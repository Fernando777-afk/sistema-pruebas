<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zoe Academy - Formulario de Estudiante</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/nav-coordinador :: nav}"></div>

    <main class="content">
        <div class="form-container">
            <h1 class="form-title" th:text="${usuario.id == null} ? 'Nuevo Estudiante' : 'Editar Estudiante'"></h1>

            <form th:action="${usuario.id == null} ? @{/coordinador/estudiantes/nuevo} : @{/coordinador/estudiantes/editar/{id}(id=${usuario.id})}"
                  th:object="${usuario}" method="post">

                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label>Nombre <span>*</span></label>
                    <input type="text" th:field="*{nombre}" class="form-control" required/>
                </div>

                <div class="form-group">
                    <label>Apellido <span>*</span></label>
                    <input type="text" th:field="*{apellido}" class="form-control" required/>
                </div>

                <div class="form-group">
                    <label>DNI <span>*</span></label>
                    <input type="text" th:field="*{dni}" class="form-control" maxlength="8" required/>
                </div>

                <div class="form-group">
                    <label>Username <span>*</span></label>
                    <input type="text" th:field="*{username}" class="form-control" required/>
                </div>

                <div class="form-group" th:if="${usuario.id == null}">
                    <label>Contraseña <span>*</span></label>
                    <input type="password" th:field="*{password}" class="form-control" required/>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" class="form-control"/>
                </div>

                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" th:field="*{telefono}" class="form-control"/>
                </div>

                <div class="form-group" th:if="${usuario.id != null}">
                    <label>Estado</label>
                    <select th:field="*{estado}" class="form-control">
                        <option value="ACTIVO">Activo</option>
                        <option value="INACTIVO">Inactivo</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save">Guardar Cambios</button>
                    <a th:href="@{/coordinador/estudiantes}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
