<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estudiantes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Estilo rápido para el botón de eliminar adaptado a tu diseño */
        .btn-delete {
            background-color: #d9534f;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9em;
            margin-left: 5px;
            display: inline-block;
            transition: background 0.2s;
        }
        .btn-delete:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/nav-coordinador :: nav}"></div>

    <main class="content">
        <div class="page-header">
            <h1>Estudiantes</h1>
            <a th:href="@{/coordinador/estudiantes/nuevo}" class="btn-primary">+ Nuevo Estudiante</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>DNI</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="e, i : ${estudiantes}">
                    <td th:text="${i.count}"></td>
                    <td th:text="${e.nombre}"></td>
                    <td th:text="${e.apellido}"></td>
                    <td th:text="${e.dni}"></td>
                    <td th:text="${e.email}"></td>
                    <td th:text="${e.telefono}"></td>
                    <td th:text="${e.estado}"></td>
                    <td>
                        <a th:href="@{/coordinador/estudiantes/editar/{id}(id=${e.id})}" class="btn-edit">Editar</a>
                        
                        <a th:href="@{/coordinador/estudiantes/eliminar/{id}(id=${e.id})}" 
                           class="btn-delete"
                           onclick="return confirm('¿Estás seguro de que deseas eliminar a este estudiante? Esta acción revocaría permanentemente sus accesos y su historial de matrículas.');">
                           Eliminar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</div>
</body>
</html>
