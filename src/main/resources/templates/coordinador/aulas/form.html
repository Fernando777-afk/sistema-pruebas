<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aula - Zoe Academy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/nav-coordinador :: nav}"></div>
    <main class="content">
        <div class="form-container">
            <h1 class="form-title" th:text="${aula.id == null} ? 'Nueva Aula' : 'Editar Aula'"></h1>
            <form th:action="${aula.id == null} ? @{/coordinador/aulas/nuevo} : @{/coordinador/aulas/editar/{id}(id=${aula.id})}"
                  th:object="${aula}" method="post">
                <div class="form-group">
                    <label>Código <span>*</span></label>
                    <input type="text" th:field="*{codigo}" class="form-control" required/>
                </div>

                <div class="form-group">
                    <label>Capacidad <span>*</span></label>
                    <input type="number" th:field="*{capacidad}" class="form-control" min="1" required/>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save">Guardar Cambios</button>
                    <a th:href="@{/coordinador/aulas}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
