<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zoe Academy - Formulario de Pago</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="layout">
    <!-- Barra lateral unificada -->
    <div th:replace="~{fragments/nav-coordinador :: nav}"></div>

    <!-- Contenido Principal -->
    <main class="content">
        <div class="form-container">
            <!-- Título dinámico adaptado al diseño moderno -->
            <h1 class="form-title" th:text="${pago.id == null} ? 'Registrar Pago' : 'Editar Pago'">Registrar Pago</h1>
            
            <form th:action="${pago.id == null} ? @{/coordinador/pagos/nuevo/{id}(id=${matriculaId})} : @{/coordinador/pagos/editar/{id}(id=${pago.id})}"
                  th:object="${pago}" method="post">
                
                <!-- Campo oculto para el ID -->
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label>Monto (S/) <span>*</span></label>
                    <input type="number" th:field="*{monto}" step="0.01" min="0" class="form-control" required/>
                </div>
                
                <div class="form-group">
                    <label>Fecha de Pago <span>*</span></label>
                    <input type="date" th:field="*{fechaPago}" class="form-control" required/>
                </div>
                
                <div class="form-group">
                    <label>Método de Pago <span>*</span></label>
                    <select th:field="*{metodoPago}" class="form-control" required>
                        <option value="">-- Seleccionar --</option>
                        <option th:each="m : ${metodos}" th:value="${m}" th:text="${m}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Observación</label>
                    <input type="text" th:field="*{observacion}" class="form-control"/>
                </div>
                
                <!-- Botones de Acción Modernizados -->
                <div class="form-actions">
                    <button type="submit" class="btn-save" th:text="${pago.id == null} ? 'Registrar Pago' : 'Actualizar Pago'">Registrar Pago</button>
                    <a th:href="@{/coordinador/pagos}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
