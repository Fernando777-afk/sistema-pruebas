<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pagos - Zoe Academy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Estilo rápido para el botón de eliminar financiero */
        .btn-delete {
            background-color: #d9534f;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9em;
            margin-left: 5px;
            display: inline-block;
            transition: background 0.2s;
        }
        .btn-delete:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/nav-coordinador :: nav}"></div>
    <main class="content">
        <div class="page-header">
            <h1>Pagos</h1>
        </div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Estudiante</th>
                    <th>Monto</th>
                    <th>Fecha</th>
                    <th>Método</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p, i : ${pagos}">
                    <td th:text="${i.count}"></td>
                    <td th:text="${p.matricula != null and p.matricula.estudiante != null} ? ${p.matricula.estudiante.nombre + ' ' + p.matricula.estudiante.apellido} : 'Sin Asignar'"></td>
                    <td th:text="'S/ ' + ${p.monto}"></td>
                    <td th:text="${p.fechaPago}"></td>
                    <td th:text="${p.metodoPago}"></td>
                    <td th:text="${p.estado}"></td>
                    <td>
                        <a th:href="@{/coordinador/pagos/editar/{id}(id=${p.id})}" class="btn-edit">Editar</a>
                        
                        <a th:href="@{/coordinador/pagos/eliminar/{id}(id=${p.id})}" 
                           class="btn-delete"
                           onclick="return confirm('¿Estás seguro de que deseas eliminar este registro de pago? Esto afectará el saldo de la matrícula de este alumno.');">
                           Eliminar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</div>
</body>
</html>
