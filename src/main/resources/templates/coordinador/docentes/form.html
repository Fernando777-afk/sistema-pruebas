<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Docente - Zoe Academy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/nav-coordinador :: nav}"></div>
    <main class="content">
        <div class="form-container">
            <h1 class="form-title" th:text="${docente.id == null} ? 'Nuevo Docente' : 'Editar Docente'"></h1>
            
            <form th:action="${docente.id == null} ? @{/coordinador/docentes/nuevo} : @{/coordinador/docentes/editar/{id}(id=${docente.id})}"
                  th:object="${docente}" method="post">
                
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label>Nombre <span>*</span></label>
                    <input type="text" th:field="*{nombre}" class="form-control" required/>
                </div>

                <div class="form-group">
                    <label>Apellido <span>*</span></label>
                    <input type="text" th:field="*{apellido}" class="form-control" required/>
                </div>

                <div class="form-group">
                    <label>DNI <span>*</span></label>
                    <input type="text" th:field="*{dni}" class="form-control" maxlength="8" required/>
                </div>

                <div class="form-group">
                    <label>Especialidad</label>
                    <input type="text" th:field="*{especialidad}" class="form-control"/>
                </div>

                <div class="form-group" th:if="${docente.id != null}">
                    <label>Estado</label>
                    <select th:field="*{estado}" class="form-control">
                        <option value="ACTIVO">Activo</option>
                        <option value="INACTIVO">Inactivo</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save">Guardar Cambios</button>
                    <a th:href="@{/coordinador/docentes}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
