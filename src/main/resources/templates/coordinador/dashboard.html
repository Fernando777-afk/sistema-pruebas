<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Coordinador</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Contenedor principal en Grid moderno */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }

        /* Diseño de Tarjetas unificado y minimalista */
        .stat-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #f3f4f6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            min-height: 140px; /* Asegura misma altura en todas */
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        /* Encabezado interno de la tarjeta (Texto + Ícono) */
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stat-info h3 {
            margin: 0;
            font-size: 0.95rem;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-number {
            margin: 8px 0 0 0;
            font-size: 2.25rem;
            font-weight: 700;
            color: #111827;
            line-height: 1;
        }

        /* Contenedor de Íconos estilizados con fondos suaves */
        .stat-icon {
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Colores de acento temáticos para cada módulo */
        .icon-blue { background-color: #eff6ff; color: #3b82f6; }
        .icon-green { background-color: #ecfdf5; color: #10b981; }
        .icon-purple { background-color: #f5f3ff; color: #8b5cf6; }
        .icon-orange { background-color: #fff7ed; color: #f97316; }
        .icon-red { background-color: #fef2f2; color: #ef4444; }

        /* Contenedor inferior para acciones como el botón de pagos */
        .stat-footer {
            margin-top: 16px;
            border-top: 1px solid #f3f4f6;
            padding-top: 12px;
            display: flex;
            justify-content: flex-end;
        }

        .stat-link {
            font-size: 0.85rem;
            font-weight: 600;
            color: #b91c1c; /* Tono guinda/rojo institucional de Zoe Academy */
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .stat-link:hover {
            color: #7f1d1d;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/nav-coordinador :: nav}"></div>

    <main class="content">
        <div class="page-header">
            <h1>Panel de Control</h1>
            <p style="color: #6b7280; margin: 4px 0 0 0;">Bienvenido de vuelta. Aquí está el estado actual de Zoe Academy.</p>
        </div>

        <div class="dashboard-grid">
            
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-info">
                        <h3>Estudiantes</h3>
                        <div class="stat-number" th:text="${totalEstudiantes != null ? totalEstudiantes : 0}">0</div>
                    </div>
                    <div class="stat-icon icon-blue">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
                    </div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-info">
                        <h3>Docentes</h3>
                        <div class="stat-number" th:text="${totalDocentes != null ? totalDocentes : 0}">0</div>
                    </div>
                    <div class="stat-icon icon-green">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                    </div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-info">
                        <h3>Matrículas</h3>
                        <div class="stat-number" th:text="${totalMatriculas != null ? totalMatriculas : 0}">0</div>
                    </div>
                    <div class="stat-icon icon-purple">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    </div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-info">
                        <h3>Ciclos</h3>
                        <div class="stat-number" th:text="${totalCiclos != null ? totalCiclos : 0}">0</div>
                    </div>
                    <div class="stat-icon icon-orange">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.213 6H16"/></svg>
                    </div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-info">
                        <h3>Pagos</h3>
                        <div class="stat-number" th:text="${totalPagos != null ? totalPagos : 0}">0</div>
                    </div>
                    <div class="stat-icon icon-red">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                </div>
                <div class="stat-footer">
                    <a th:href="@{/coordinador/pagos}" class="stat-link">
                        Gestionar Caja &rarr;
                    </a>
                </div>
            </div>

        </div>
    </main>
</div>
</body>
</html>
