<nav th:fragment="nav" class="sidebar">
    <div class="sidebar-brand">
        <h2>ZOE ACADEMY</h2>
        <p>Estudiante</p>
    </div>
    
    <ul class="sidebar-menu">
		<li><a th:href="@{/estudiante/dashboard}">Inicio</a></li>
        <li><a th:href="@{/estudiante/mis-cursos}"> Mis Cursos</a></li>
        <li><a th:href="@{/estudiante/mis-pagos}"> Mis Pagos</a></li>
    </ul>

    <div class="sidebar-logout">
        <form th:action="@{/logout}" method="post">
            <button type="submit"> Cerrar Sesión</button>
        </form>
    </div>
	<script>
	document.addEventListener("DOMContentLoaded", function () {

	    const currentPath = window.location.pathname;

	    document.querySelectorAll(".sidebar-menu a").forEach(link => {

	        if(currentPath.startsWith(new URL(link.href).pathname)){
	            link.classList.add("active");
	        }

	    });

	});
	</script>
</nav>
